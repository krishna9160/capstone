name: CI Build

on:
  push:
    branches: [ "main" ]   # or "master" if that's your default
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # <-- change here

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8

      - name: Lint (pylint)
        run: |
          pylint app || true

      - name: Run unit tests (nosetests)
        run: nosetests -v --with-coverage --cover-package=app
